manifest_path: outputs/person_windows/person_window_manifest.csv
model_output_dir: outputs/models
metrics_output_dir: outputs/metrics
figures_output_dir: outputs/figures

model_name: resnet50
image_size: 224
batch_size: 8
num_workers: 0
epochs: 15
head_epochs: 5
lr_head: 0.001
lr_finetune: 0.0001
weight_decay: 0.0001
freeze_backbone: true
unfreeze_layer4: true
num_classes: 2
pretrained: true
dropout: 0.30
use_augmentation: true
early_stopping: true
early_stopping_patience: 4
random_seed: 21
device: auto
best_model_name: best_model.pt
last_model_name: last_model.pt
